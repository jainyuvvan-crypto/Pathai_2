<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PathAI turns ambitious learning goals into clear, visual roadmaps." />
    <title>PathAI — Learn in a direction</title>
    <link rel="stylesheet" href="./src/styles.css?v=20261020-6" />
    <style>
      .ticker-track { width: max-content; min-width: max-content; animation: ticker 16s linear infinite; white-space: nowrap; }
      .ticker-group { display: flex; align-items: center; gap: 29px; flex: 0 0 auto; padding-right: 29px; }
      .billing-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: -2px 0 19px; }
      .billing-option { min-height: 43px; padding: 6px 5px; border: 1px solid #474743; background: transparent; color: #aaa; font: 9px 'IBM Plex Mono', monospace; text-align: left; }
      .billing-option b { display: block; color: #fff; font: 600 11px 'Space Grotesk', sans-serif; margin-top: 2px; }
      .billing-option.selected { border-color: #fff; background: rgba(255,255,255,.08); color: #fff; }
      .billing-option.selected b { color: #fff; }
      @media (max-width: 700px) { .billing-options { gap: 4px; } .billing-option { font-size: 8px; } .billing-option b { font-size: 10px; } }
      .pricing-section { display: block; max-width: 1320px; background: #efefe9; text-align: center; }
      .pricing-headline .section-number { display: block; padding-top: 0; margin-bottom: 17px; }
      .pricing-headline h2 { font: 600 clamp(50px, 6vw, 76px)/.93 'Space Grotesk', sans-serif; letter-spacing: -.065em; margin: 0 0 17px; }
      .pricing-headline h2 em { color: #111; font-style: normal; }
      .pricing-headline p { color: #555451; max-width: 390px; margin: 0 auto 25px; font-size: 15px; }
      .billing-switch { display: inline-flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid #d8d8d0; background: #fff; }
      .billing-mode { min-height: 32px; padding: 0 15px; background: transparent; color: #77776f; font: 600 10px 'IBM Plex Mono', monospace; }
      .billing-mode.selected { background: #151515; color: #fff; }
      .savings-badge { margin: 0 7px 0 4px; padding: 4px 6px; background: #e7e7e4; color: #111; font: 600 9px 'IBM Plex Mono', monospace; }
      .pricing-section .pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 1110px; margin: 44px auto 0; text-align: left; }
      .pricing-section .price-card { min-height: 450px; padding: 27px; display: flex; flex-direction: column; }
      .pricing-section .price-card h3 { margin-top: 23px; }
      .pricing-section .price-card > p { min-height: 54px; }
      .pricing-section .price-pro { transform: translateY(-8px); }
      .pricing-section .price-annual { background: #fff; }
      .pricing-section .price-annual .price-tag { color: #111; }
      .pricing-section .price-card > .button { margin-top: auto; }
      .pricing-section .price-pro .billing-options + .button { margin-top: 0; }
      .pricing-reassurance { display: flex; justify-content: space-between; gap: 20px; max-width: 1110px; margin: 28px auto 0; color: #77776f; font: 10px 'IBM Plex Mono', monospace; text-align: left; }
      .pricing-reassurance span { display: inline-flex; align-items: center; gap: 7px; }
      @media (max-width: 980px) { .pricing-section .pricing-grid { grid-template-columns: repeat(2, 1fr); } .pricing-section .price-annual { grid-column: 1 / -1; min-height: auto; } }
      @media (max-width: 700px) { .pricing-section .pricing-grid { grid-template-columns: 1fr; margin-top: 32px; } .pricing-section .price-pro { transform: none; } .pricing-section .price-annual { grid-column: auto; } .pricing-reassurance { display: grid; gap: 10px; } .pricing-headline h2 { font-size: 51px; } }
      @media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; transform: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="./src/auth.js?v=20261021-2"></script>
    <script type="module" src="./src/main.js?v=20261021-1"></script>
  </body>
</html>
